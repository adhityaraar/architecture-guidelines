<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">DataStage data-center recovery choices</title>
  <desc id="desc">Comparison of continuous storage replication and a coordinated Level 0 backup and restore for recovering DataStage at another data center.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f7b5e"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #20252b; }
      .subtitle { font: 17px Arial, sans-serif; fill: #4b5563; }
      .panel-title { font: 700 23px Arial, sans-serif; fill: #20252b; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #20252b; }
      .copy { font: 15px Arial, sans-serif; fill: #38424d; }
      .small { font: 14px Arial, sans-serif; fill: #4b5563; }
      .metric { font: 700 15px Arial, sans-serif; fill: #20252b; }
      .step { font: 600 15px Arial, sans-serif; fill: #20252b; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="788" fill="#ffffff" stroke="#d7dde4" stroke-width="2"/>
  <text x="40" y="46" class="title">Data-Center Recovery Choices</text>
  <text x="40" y="73" class="subtitle">Both methods create a recoverable copy at the DR site, but they optimize for different recovery objectives.</text>

  <!-- Storage replication panel -->
  <rect x="35" y="105" width="550" height="625" rx="4" fill="#f8fbff" stroke="#2563a6" stroke-width="3"/>
  <text x="310" y="141" text-anchor="middle" class="panel-title">1. Storage Replication</text>
  <text x="310" y="166" text-anchor="middle" class="copy">Changed blocks or files are copied continuously or frequently.</text>

  <rect x="70" y="198" width="190" height="198" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="165" y="227" text-anchor="middle" class="box-title">Primary Site</text>
  <rect x="92" y="247" width="146" height="38" rx="3" fill="#e8f1fb" stroke="#2563a6"/>
  <text x="165" y="271" text-anchor="middle" class="copy">Repository DB</text>
  <rect x="92" y="296" width="146" height="38" rx="3" fill="#e8f1fb" stroke="#2563a6"/>
  <text x="165" y="320" text-anchor="middle" class="copy">Services config</text>
  <rect x="92" y="345" width="146" height="38" rx="3" fill="#e8f1fb" stroke="#2563a6"/>
  <text x="165" y="369" text-anchor="middle" class="copy">Engine files</text>

  <rect x="360" y="198" width="190" height="198" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="455" y="227" text-anchor="middle" class="box-title">DR Site Copies</text>
  <rect x="382" y="247" width="146" height="38" rx="3" fill="#edf4fb" stroke="#2563a6"/>
  <text x="455" y="271" text-anchor="middle" class="copy">DB copy: 10:02</text>
  <rect x="382" y="296" width="146" height="38" rx="3" fill="#edf4fb" stroke="#2563a6"/>
  <text x="455" y="320" text-anchor="middle" class="copy">Config: 10:01</text>
  <rect x="382" y="345" width="146" height="38" rx="3" fill="#edf4fb" stroke="#2563a6"/>
  <text x="455" y="369" text-anchor="middle" class="copy">Files: 10:00</text>

  <line x1="238" y1="266" x2="382" y2="266" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="238" y1="315" x2="382" y2="315" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="238" y1="364" x2="382" y2="364" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="310" y="416" text-anchor="middle" class="small">Example: asynchronous copies have different recovery timestamps</text>

  <rect x="70" y="444" width="480" height="94" rx="4" fill="#fff8e6" stroke="#c98b18" stroke-width="2"/>
  <text x="90" y="472" class="box-title">Recovery consequence</text>
  <text x="90" y="497" class="copy">Recent data can provide a low RPO and faster activation,</text>
  <text x="90" y="520" class="copy">but repository, configuration, and files may need reconciliation.</text>

  <text x="85" y="575" class="step">1. Fence the failed primary site</text>
  <text x="85" y="603" class="step">2. Select and mount an approved consistent copy</text>
  <text x="85" y="631" class="step">3. Recover repository, services, then engine</text>
  <text x="85" y="659" class="step">4. Reconcile interrupted jobs and partial output</text>
  <rect x="70" y="682" width="225" height="30" rx="3" fill="#e8f1fb" stroke="#2563a6"/>
  <text x="182" y="703" text-anchor="middle" class="metric">Lower RPO / Usually lower RTO</text>
  <rect x="310" y="682" width="240" height="30" rx="3" fill="#fff1f1" stroke="#bb2d3b"/>
  <text x="430" y="703" text-anchor="middle" class="metric">Consistency plan is mandatory</text>

  <!-- Level 0 panel -->
  <rect x="615" y="105" width="550" height="625" rx="4" fill="#f8fcfa" stroke="#0f7b5e" stroke-width="3"/>
  <text x="890" y="141" text-anchor="middle" class="panel-title">2. Level 0 Backup and Restore</text>
  <text x="890" y="166" text-anchor="middle" class="copy">A complete baseline is captured at a coordinated checkpoint.</text>

  <rect x="650" y="198" width="190" height="198" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="745" y="227" text-anchor="middle" class="box-title">Primary at 02:00</text>
  <rect x="672" y="247" width="146" height="38" rx="3" fill="#eaf7f2" stroke="#0f7b5e"/>
  <text x="745" y="271" text-anchor="middle" class="copy">Supported DB backup</text>
  <rect x="672" y="296" width="146" height="38" rx="3" fill="#eaf7f2" stroke="#0f7b5e"/>
  <text x="745" y="320" text-anchor="middle" class="copy">Services config</text>
  <rect x="672" y="345" width="146" height="38" rx="3" fill="#eaf7f2" stroke="#0f7b5e"/>
  <text x="745" y="369" text-anchor="middle" class="copy">Engine files</text>

  <rect x="940" y="222" width="190" height="150" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="1035" y="251" text-anchor="middle" class="box-title">Level 0 Baseline</text>
  <text x="1035" y="281" text-anchor="middle" class="copy">One complete set</text>
  <text x="1035" y="306" text-anchor="middle" class="copy">Checkpoint: 02:00</text>
  <text x="1035" y="334" text-anchor="middle" class="small">Stored off-site</text>
  <text x="1035" y="354" text-anchor="middle" class="small">or at the DR location</text>

  <line x1="818" y1="266" x2="940" y2="266" stroke="#0f7b5e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="818" y1="315" x2="940" y2="315" stroke="#0f7b5e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="818" y1="364" x2="940" y2="344" stroke="#0f7b5e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="890" y="416" text-anchor="middle" class="small">Disaster at 10:05: restore every included tier to the 02:00 checkpoint</text>

  <rect x="650" y="444" width="480" height="94" rx="4" fill="#eaf7f2" stroke="#0f7b5e" stroke-width="2"/>
  <text x="670" y="472" class="box-title">Recovery consequence</text>
  <text x="670" y="497" class="copy">The restored tiers share one deliberate recovery point,</text>
  <text x="670" y="520" class="copy">but all changes after 02:00 are outside the baseline.</text>

  <text x="665" y="575" class="step">1. Retrieve and verify the complete baseline</text>
  <text x="665" y="603" class="step">2. Restore database and persistent file systems</text>
  <text x="665" y="631" class="step">3. Start repository, services, then engine</text>
  <text x="665" y="659" class="step">4. Reapply later changes only through an approved method</text>
  <rect x="650" y="682" width="225" height="30" rx="3" fill="#eaf7f2" stroke="#0f7b5e"/>
  <text x="762" y="703" text-anchor="middle" class="metric">Consistent baseline</text>
  <rect x="890" y="682" width="240" height="30" rx="3" fill="#fff8e6" stroke="#c98b18"/>
  <text x="1010" y="703" text-anchor="middle" class="metric">Higher RPO / Longer restore</text>

  <rect x="190" y="747" width="820" height="30" rx="3" fill="#f3f4f6" stroke="#69737d"/>
  <text x="600" y="768" text-anchor="middle" class="metric">In both choices: preserve host identity, validate dependencies, and restart workloads only after reconciliation</text>
</svg>
